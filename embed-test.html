<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delfos P2P iframe test</title>
<style>body{font-family:system-ui;background:#1b1530;color:#eee;margin:0;padding:16px}
h2{font-size:16px;margin:18px 0 6px}p{font-size:13px;color:#bbb;margin:0 0 8px}
.wrap{display:flex;gap:24px;flex-wrap:wrap}iframe{max-width:100%;background:#000}</style></head>
<body>
<h1 style="font-size:18px">Delfos P2P - iframe test (not linked, for testing wallets inside the embed)</h1>
<p id="diag" style="font-size:15px;color:#fff;background:#333;padding:8px;border-radius:6px">checking...</p>
<script>
function check(){
  var k = !!window.keplr, g = !!(window.station || window.galaxyStation);
  document.getElementById('diag').textContent =
    'This top page (not the iframe): window.keplr = ' + (k ? 'YES' : 'no') +
    ' | Galaxy = ' + (g ? 'YES' : 'no') + ' | ' + location.protocol + ' | ' + navigator.userAgent.slice(0, 80);
}
check(); setTimeout(check, 1500); setTimeout(check, 4000);
</script>
<div class="wrap">
<div>
<h2>A. Exact code from the Delfos site (with sandbox)</h2>
<p>sandbox="allow-scripts allow-same-origin allow-forms"</p>
<iframe src="https://p2p.delfos-hub.net/embed.html"
  title="Delfos P2P market" width="420" height="760"
  sandbox="allow-scripts allow-same-origin allow-forms">
</iframe>
</div>
<div>
<h2>B. EMBEDDING.md code (no sandbox)</h2>
<p>for comparison</p>
<iframe src="https://p2p.delfos-hub.net/embed" title="Delfos P2P market (no sandbox)" width="420" height="760" style="border:0"></iframe>
</div>
</div>
</body></html>
